<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ufuk Küçüktopçu tarafından geliştirilen projelere ait gizlilik politikaları.">
  <title>Gizlilik Politikaları | Ufuk Küçüktopçu</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080c14;
      --panel: #101626;
      --text: #f3f6fb;
      --muted: #aeb8c7;
      --line: rgba(255, 255, 255, 0.1);
      --accent: #76d4bd;
      --accent-2: #b8c7ff;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.36);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      background:
        radial-gradient(circle at 12% 0, rgba(118, 212, 189, 0.14), transparent 30%),
        radial-gradient(circle at 88% 10%, rgba(184, 199, 255, 0.14), transparent 28%),
        var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.55;
    }

    a { color: inherit; text-decoration: none; }

    .shell {
      display: grid;
      align-content: center;
      width: 100%;
      max-width: 760px;
      min-height: 100svh;
      margin: 0 auto;
      padding: 28px 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 26px;
    }

    .back {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.04);
      padding: 9px 14px;
      color: var(--accent);
      font-weight: 800;
    }

    .page-label {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 700;
      text-align: right;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(16, 22, 38, 0.9);
      box-shadow: var(--shadow);
      padding: clamp(24px, 5vw, 44px);
    }

    h1,
    p { margin-top: 0; }

    h1 {
      margin-bottom: 12px;
      font-size: clamp(2.2rem, 7vw, 4.5rem);
      line-height: 0.96;
      letter-spacing: 0;
    }

    .lead {
      max-width: 620px;
      margin-bottom: 26px;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.12rem);
    }

    .project-list {
      display: grid;
      gap: 12px;
    }

    .project-button {
      display: flex;
      min-height: 76px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border: 1px solid rgba(118, 212, 189, 0.2);
      border-radius: 14px;
      background: rgba(118, 212, 189, 0.08);
      padding: 16px 18px;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .project-button:hover,
    .project-button:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(118, 212, 189, 0.42);
      background: rgba(118, 212, 189, 0.12);
      outline: none;
    }

    .project-name {
      font-size: clamp(1.15rem, 3vw, 1.45rem);
      font-weight: 900;
      line-height: 1.1;
    }

    .project-meta {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 650;
    }

    .open-label {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 10px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 900;
      white-space: nowrap;
    }

    @media (max-width: 560px) {
      .shell {
        align-content: start;
        padding: 28px 12px;
      }

      .topbar {
        align-items: flex-start;
      }

      .page-label {
        display: none;
      }

      .project-button {
        align-items: flex-start;
        flex-direction: column;
      }

      .open-label {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="back" href="index.html">Ana Menü</a>
      <div class="page-label">Ufuk Küçüktopçu</div>
    </header>

    <section class="panel" aria-labelledby="page-title">
      <h1 id="page-title">Gizlilik Politikaları</h1>
      <p class="lead">Projeye ait gizlilik politikasını açmak için aşağıdaki proje adını seçin.</p>

      <nav class="project-list" aria-label="Proje gizlilik politikaları">
        <a class="project-button" href="miini-buddy-gizlilik-politikasi.html">
          <span>
            <span class="project-name">Miini Buddy</span>
            <span class="project-meta">Kullanıcı Gizlilik Sözleşmesi</span>
          </span>
          <span class="open-label">Aç</span>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>

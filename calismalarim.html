<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Çalışmalarım</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --bg:#090b12; --panel:#111527; --text:#f3f6fb; --muted:#a7b0c0; --line:rgba(255,255,255,.1); --accent:#8be9d4; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; background: radial-gradient(circle at 20% 0, rgba(139,233,212,.15), transparent 30%), var(--bg); color: var(--text); display: grid; place-items: center; padding: 24px; }
    main { width: min(760px, 100%); border: 1px solid var(--line); border-radius: 18px; background: rgba(17,21,39,.88); padding: clamp(24px, 5vw, 42px); box-shadow: 0 24px 70px rgba(0,0,0,.36); }
    a { color: var(--accent); text-decoration: none; font-weight: 800; }
    h1 { margin: 18px 0 12px; font-size: clamp(2rem, 6vw, 4rem); line-height: 1; letter-spacing: 0; }
    p { margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.7; }
    .back { display: inline-flex; margin-bottom: 18px; }
  </style>
</head>
<body>
  <main>
    <a class="back" href="index.html">Ana Menü</a>
    <h1>Çalışmalarım</h1>
    <p>Bu sayfaya projelerinizi, denemelerinizi, yayınladığınız işleri veya GitHub repolarınızı ekleyebilirsiniz.</p>
  </main>
</body>
</html>
